<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Follower Counter</title>
    <style>
        /* Centers everything and makes the background dark */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212; /* Dark grey/black background */
        }

        /* Makes the counter bigger */
        .counter-embed {
            transform: scale(1.5); /* Change 1.5 to 2.0 to make it twice as big, etc. */
            transform-origin: center;
        }
    </style>
</head>
<body>

    <!-- Added a class to the iframe to target it with the scale effect -->
    <iframe class="counter-embed" height="80px" width="300px" frameborder="0" src="https://livecounts.io/embed/tiktok-live-follower-counter/theofficialbaconguy" style="border: 0; width:300px; height:80px;"></iframe>

</body>
</html>
